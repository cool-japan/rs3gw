{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rs3gw.fullname" . }}-credentials
  labels:
    {{- include "rs3gw.labels" . | nindent 4 }}
type: Opaque
stringData:
  RS3GW_ACCESS_KEY: {{ .Values.auth.accessKey | quote }}
  RS3GW_SECRET_KEY: {{ .Values.auth.secretKey | quote }}
{{- end }}
