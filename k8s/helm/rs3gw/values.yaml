# Default values for rs3gw
# This is a YAML-formatted file.

# Number of replicas
replicaCount: 1

image:
  repository: ghcr.io/cool-japan/rs3gw
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 1000

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9000
  # NodePort only used when type is NodePort
  nodePort: 30900

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: s3.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: s3-tls
  #    hosts:
  #      - s3.local

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# rs3gw configuration
config:
  # Server bind address
  bindAddr: "0.0.0.0:9000"
  # Default bucket name
  defaultBucket: "default"
  # Compression mode: none, zstd, zstd:LEVEL (1-22), lz4
  compression: "zstd:3"
  # Request timeout in seconds (0 = no timeout)
  requestTimeout: 300
  # Max concurrent requests (0 = no limit)
  maxConcurrent: 0
  # Log level
  logLevel: "info"

# Authentication credentials (stored in Secret)
auth:
  # Access key (empty = no authentication)
  accessKey: ""
  # Secret key (empty = no authentication)
  secretKey: ""
  # Use existing secret instead of creating one
  existingSecret: ""
  # Keys in the existing secret
  accessKeyKey: "RS3GW_ACCESS_KEY"
  secretKeyKey: "RS3GW_SECRET_KEY"

# Persistence configuration
persistence:
  enabled: true
  # Storage class - empty uses default
  storageClass: ""
  # Access mode
  accessMode: ReadWriteOnce
  # Storage size
  size: 100Gi
  # Annotations for PVC
  annotations: {}
  # Use existing PVC
  existingClaim: ""

# TLS configuration
tls:
  enabled: false
  # Use existing secret containing tls.crt and tls.key
  existingSecret: ""
  # Certificate and key (base64 encoded) if not using existing secret
  certificate: ""
  privateKey: ""

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Additional environment variables
extraEnv: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Additional volume mounts
extraVolumeMounts: []

# Additional volumes
extraVolumes: []
