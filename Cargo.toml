aws-config = { workspace = true, optional = true }

# Google Cloud Storage SDK
google-cloud-storage = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-wkt = { workspace = true, optional = true }

# Azure Storage SDK
azure_storage = { workspace = true, optional = true }
azure_storage_blobs = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Unix-specific dependencies
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# io_uring support (Linux only, optional)
tokio-uring = { workspace = true, optional = true }

[dev-dependencies]
# Testing
tokio-test.workspace = true
tempfile.workspace = true
aws-sdk-s3.workspace = true
aws-config.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
tokio-tungstenite.workspace = true

# Benchmarking
criterion.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protox.workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "storage_benchmarks"
harness = false

[[bench]]
name = "compression_benchmarks"
harness = false

[[bench]]
name = "api_benchmarks"
harness = false

[[bench]]
name = "load_testing_benchmarks"
harness = false

[[bench]]
name = "s3_api_benchmarks"
harness = false

[[bench]]
name = "grpc_vs_rest_benchmarks"
harness = false

[[bin]]
name = "rs3gw"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "testdata-generator"
path = "src/bin/testdata_generator.rs"
required-features = ["formats"]

[[bin]]
name = "s3-migrate"
path = "src/bin/s3_migrate.rs"
required-features = ["s3", "server"]

[[bin]]
name = "rs3ctl"
path = "src/bin/rs3ctl.rs"
required-features = ["server"]
